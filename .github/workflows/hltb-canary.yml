# Weekly check against the LIVE HowLongToBeat site.
#
# HowLongToBeat has moved or changed its private API four times so far, and every
# time the library went quiet instead of failing loudly. This job exists so the
# next time is noticed in days rather than months: it opens an issue when the
# library stops getting data, and closes it again when HLTB recovers.

name: HLTB Canary

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # npm 11 blocks postinstall scripts by default, so `npm ci` does NOT
      # download Chrome and Puppeteer fails to launch. Install it explicitly.
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run canary
        id: canary
        run: npm run canary

      - name: Open, update or close the canary issue
        if: always()
        uses: actions/github-script@v9
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'hltb-canary';
            const TITLE = 'HLTB canary: the library is not getting data';
            const broken = process.env.CANARY_OUTCOME === 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;

            let report = '_No report was produced - the job probably failed before running the canary._';
            try {
              report = fs.readFileSync('canary-report.md', 'utf8');
            } catch (error) {
              core.warning(`Could not read canary-report.md: ${error.message}`);
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL
            });
            const existing = open[0];

            if (broken) {
              const body = `${report}\n\n[Workflow run](${runUrl})`;
              if (existing) {
                // Comment instead of piling up one issue per week
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still failing.\n\n${body}`
                });
                core.notice(`Commented on existing issue #${existing.number}`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: TITLE,
                  labels: [LABEL],
                  body: `${body}\n\n---\n`
                    + `The offline tests (\`npm test\`) can't catch this: it is a change on `
                    + `HowLongToBeat's side, not a regression here. See the Troubleshooting `
                    + `section of the README for how to locate the new route.`
                });
                core.notice(`Opened issue #${created.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered - the canary is passing again.\n\n${report}\n\n[Workflow run](${runUrl})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
              core.notice(`Closed issue #${existing.number}`);
            }
