# Publishes the package to npm when a GitHub release is published.
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    # "published" also fires when a release saved as a draft is published later,
    # which "created" does not. Using "created" silently skips those releases.
    types: [published]
  # Lets the workflow be run by hand from the Actions tab, without having to
  # create or delete a release (useful to recover a failed publish).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Offline contract tests: deterministic, and they exit non-zero on
      # failure, so a broken build cannot reach the publish job
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
